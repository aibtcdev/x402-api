name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run check
      # Unit tests only. `npm test` runs the lifecycle suite against a live worker
      # and needs X402_CLIENT_PK (a funded mnemonic), so it stays a manual run.
      - run: bun test tests/*.unit.test.ts
